name: sendbird_uikit
description: With Sendbird UIKit for Flutter, you can easily build an in-app chat with all the essential messaging features.
version: 1.4.0
homepage: https://sendbird.com
repository: https://github.com/sendbird/sendbird-uikit-flutter
documentation: https://sendbird.com/docs/chat/uikit/v3/flutter/overview

environment:
  sdk: '>=3.3.0 <4.0.0'

platforms:
  android:
  ios:
  web:

dependencies:
  flutter:
    sdk: flutter

  sendbird_chat_sdk: ^4.8.0
  provider: ^6.1.2
  intl: '>=0.18.1 <1.0.0'
  collection: ^1.18.0
  cached_network_image: ^3.3.1
  shared_preferences: ^2.2.3
  fluttertoast: ^8.2.5
  http: ^1.2.1
  web_socket_channel: 2.4.0
  video_thumbnail: ^0.5.3
  path_provider: ^2.1.3
  gif: ^2.3.0
  scroll_to_index: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

flutter:
  uses-material-design: true
  generate: true
  fonts:
    - family: SfProText
      fonts:
        - asset: assets/fonts/sf_pro_text_light.ttf
          weight: 300
        - asset: assets/fonts/sf_pro_text_regular.ttf
          weight: 400
        - asset: assets/fonts/sf_pro_text_medium.ttf
          weight: 500
        - asset: assets/fonts/sf_pro_text_semibold.ttf
          weight: 600
        - asset: assets/fonts/sf_pro_text_bold.ttf
          weight: 700
        - asset: assets/fonts/sf_pro_text_heavy.ttf
          weight: 900

  assets:
    - assets/
    - assets/icons/